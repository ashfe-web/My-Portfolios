<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #a0c878, #f5fbe9);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h2 {
      color: #2f4f4f;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .contact-card {
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 25px;
      background-color: #ffffff;
      transition: transform 0.3s ease;
      position: relative;
    }

    .contact-card:hover {
      transform: translateY(-5px);
    }

    .profile-circle {
      width: 60px;
      height: 60px;
      background-color: #a0c878;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: -30px;
      left: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .contact-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-left: 80px;
    }

    .contact-info {
      margin-left: 80px;
      margin-top: 10px;
    }

    .contact-info p {
      margin-bottom: 6px;
    }

    .contact-info a {
      text-decoration: none;
      color: #0d6efd;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .icon {
      color: #555;
      margin-right: 6px;
    }

    @media (max-width: 767px) {
      .contact-card {
        margin-bottom: 20px;
      }
      .contact-name, .contact-info {
        margin-left: 0;
        padding-left: 10px;
      }
      .profile-circle {
        position: static;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

<div class="container py-5">
